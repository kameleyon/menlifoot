# Refresh the Champions League player pool from UEFA's fantasy feed.
#
# NOT SCHEDULED, and it will fail on a GitHub-hosted runner. Kept because it
# works the moment a self-hosted runner exists, and because a deleted workflow
# takes the reason with it.
#
# UEFA answers a browser and an ordinary connection, and drops requests from
# data centres. The Supabase edge function fails at the connection layer for
# every season id; a GitHub-hosted run hung for 81 seconds and was killed. The
# feed is fine and the season id is right - the caller is being refused, and no
# header will change that, because the judgement is on the network and the TLS
# fingerprint.
#
# The live schedule is a Windows scheduled task on a machine UEFA will talk to:
#     scripts/install-uefa-task.ps1     registers it for 06:05 daily
#     scripts/push-uefa-players.cmd     what the task runs
#
# To use this workflow instead, add a self-hosted runner on an ordinary
# connection, change runs-on below to match its label, and restore the schedule.
#
# Secrets, if you do:
#   VITE_SUPABASE_URL              https://<ref>.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY  the publishable/anon key
# Both already ship in the built frontend, so neither adds exposure.
name: UEFA fantasy sync

on:
  # Manual only. A daily run against a blocked network is a failure notice
  # every morning that says nothing new.
  workflow_dispatch:

# One at a time: two overlapping pushes would race on the same rows.
concurrency:
  group: uefa-fantasy-sync
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Push UEFA player feed
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        # The script exits non-zero on a bad feed, an empty player list or a
        # failed sync, so a silent failure shows up as a failed run rather than
        # as a pool that quietly stops updating - which is exactly how the old
        # feed rotted unnoticed for days.
        run: node scripts/push-uefa-players.mjs
